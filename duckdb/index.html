   <script type="importmap">

      "@duckdb/duckdb-wasm": "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.29/+esm"

<body class="bg-indigo-950 text-rose-50 flex items-center justify-evenly min-h-screen">
  <script>
    function fileHandler(event) {
	const file = event.target.files[0];
	const reader = new FileReader();
	reader.onload = async () => {
	    
	    document.getElementById("message").innerHTML= `<span>DuckDB is parsing CSV.</span>`
	    await duckdb.registerFileText(`data.csv`, reader.result);

	    //names = await con.getTableNames("SELECT * FROM FOO");
	    res = await con.query("DROP TABLE IF EXISTS foo;");
	    
	    await con.insertCSVFromPath('data.csv', {
		schema: 'main',
		name: 'foo',
		detect: true,
		header: true,
		delimiter: ','
	    });
	    document.getElementById("message").innerHTML = `<span>Performing Query.</span>`
	    stmt = " SELECT 10*floor(age/10) AS age_cat, gender, round(avg(effect),2), round(corr(effect,treatment),2) FROM foo GROUP BY CUBE (age_cat, gender);"
	    res = await con.query(stmt);
	    //res_json = res.toArray().map((row) => row.toJSON());
	    document.getElementById("message").innerHTML= `<span>Rendering HTML table.</span>`
	    res_json = res.toArray().map((row) => {
		rhtml = row.toArray().map(val =>  `<td class="px-4 py-2">${val}</td>`).join("" )
		return `<tr class="divide-y divide-gray-50">${rhtml}</td>`;
	    }).join("\n");

	    document.getElementById("result").innerHTML = `<table class="table-auto">${res_json}</table>`
	    document.getElementById("message").innerHTML= `<span>Done.</span>`
	}
	document.getElementById("message").innerHTML= `<span>Loading data from disk.</span>`
	document.getElementById("result").innerHTML = ""
	reader.readAsText(file)
    }
    </script>

  <div>
    <label for="myfile">Get started by opening a <span>*.csv</span> file:</label><br/>
    <input type="file" name="myfile" accept="text/csv" onchange="fileHandler(event)">
    <div id="message"></div>
</div>
<div id="result" class="flex items-center justify-evenly py-16"></div>

<script type="module">
import init, * as bindings from './duckdb-wasm-41762ae3327173c1.js';
const wasm = await init({ module_or_path: './duckdb-wasm-41762ae3327173c1_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script></body>
